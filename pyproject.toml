[project]
name = "jevprobe"
version = "1.0.0"
description = "Automated prompt-injection measurement for Jev (TypeSafe AI) applications"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "python-dotenv",
  "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jevprobe*"]
